[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xray"
version = "0.1.0"
description = "HackSpain X-Ray · reto Embat: score de salud financiera"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]
# Narrativa LLM opcional (docs/llm-narrativa.md). El producto funciona sin esto: sin clave,
# los textos son plantillas deterministas. `output_config` exige un SDK reciente.
llm = ["anthropic>=0.105"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xray.pulse" = ["configs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
]

[tool.uv]
# La caché de uv en este equipo está en una carpeta sincronizada con la nube, que no admite enlaces duros
link-mode = "copy"
