[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xray"
version = "0.1.0"
description = "HackSpain X-Ray · reto Embat: score de salud financiera"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
